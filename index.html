<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Calculator</title>
  <style>
    :root {
      --bg-color: #0a0d14;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --muted-color: #94a3b8;
      --primary: #3cfaf4;
      --border: #b96ea9;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--primary);
    }

    .demo-btn-container {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .btn-demo {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-demo:hover {
      background-color: var(--primary);
      color: #000;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted-color);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text-color);
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      background-color: var(--primary);
      color: #000;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .summary-box {
      background-color: var(--bg-color);
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .summary-box h3 {
      font-size: 0.85rem;
      color: var(--muted-color);
      margin-bottom: 0.25rem;
    }

    .summary-box p {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .status-banner {
      text-align: center;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      margin-top: 1rem;
    }

    .status-banner.success { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-banner.danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted-color);
      font-size: 0.85rem;
    }

    .tag {
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .tag-High { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .tag-Medium { background-color: rgba(245, 158, 11, 0.2); color: var(--primary); }
    .tag-Low { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Personal Expense Calculator</h1>

    <div class="demo-btn-container">
      <button id="loadDemoBtn" class="btn-demo">⚡ Click to Load Sample Data</button>
    </div>

    <!-- Income Input Card -->
    <div class="card">
      <div class="form-group">
        <label for="income">Total Monthly Income (₹)</label>
        <input type="number" id="income" placeholder="Enter income (e.g. 50000)" min="0" />
      </div>
    </div>

    <!-- Expense Entry Card -->
    <div class="card">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <div class="form-group">
          <label for="expenseName">Expense Name</label>
          <input type="text" id="expenseName" placeholder="e.g. House Rent, Groceries" required />
        </div>
        <div class="form-group">
          <label for="expenseAmount">Amount (₹)</label>
          <input type="number" id="expenseAmount" placeholder="e.g. 15000" min="0" step="0.01" required />
        </div>
        <button type="submit" class="btn">Add Expense</button>
      </form>
    </div>

    <!-- Summary Report Card -->
    <div class="card">
      <h2>Summary Report</h2>
      <div class="summary-grid">
        <div class="summary-box">
          <h3>Total Income</h3>
          <p id="displayIncome">₹0.00</p>
        </div>
        <div class="summary-box">
          <h3>Total Expenses</h3>
          <p id="displayExpenses">₹0.00</p>
        </div>
        <div class="summary-box">
          <h3>Net Savings</h3>
          <p id="displaySavings">₹0.00</p>
        </div>
      </div>
      <div id="statusBanner" class="status-banner" style="display: none;"></div>

      <!-- Expense Table -->
      <table>
        <thead>
          <tr>
            <th>Expense Name</th>
            <th>Amount</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="expenseTableBody">
          <tr>
            <td colspan="3" style="text-align: center; color: var(--muted-color);">No expenses added yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let income = 0;
    let expenses = [];

    const incomeInput = document.getElementById('income');
    const expenseForm = document.getElementById('expenseForm');
    const expenseNameInput = document.getElementById('expenseName');
    const expenseAmountInput = document.getElementById('expenseAmount');
    const loadDemoBtn = document.getElementById('loadDemoBtn');
    
    const displayIncome = document.getElementById('displayIncome');
    const displayExpenses = document.getElementById('displayExpenses');
    const displaySavings = document.getElementById('displaySavings');
    const statusBanner = document.getElementById('statusBanner');
    const expenseTableBody = document.getElementById('expenseTableBody');

    function categorizeExpense(amount) {
      if (amount >= 5000) return 'High';
      if (amount >= 1000) return 'Medium';
      return 'Low';
    }

    function updateReport() {
      let totalExpenses = 0;
      for (let i = 0; i < expenses.length; i++) {
        totalExpenses += expenses[i].amount;
      }

      const savings = income - totalExpenses;

      displayIncome.textContent = '₹' + income.toFixed(2);
      displayExpenses.textContent = '₹' + totalExpenses.toFixed(2);
      displaySavings.textContent = '₹' + savings.toFixed(2);

      statusBanner.style.display = 'block';
      if (savings < 0) {
        statusBanner.className = 'status-banner danger';
        statusBanner.textContent = 'ALERT: You are spending more than your income!';
      } else {
        statusBanner.className = 'status-banner success';
        statusBanner.textContent = 'GREAT JOB: You are living within your budget!';
      }

      if (expenses.length === 0) {
        expenseTableBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--muted-color);">No expenses added yet.</td></tr>';
        return;
      }

      expenseTableBody.innerHTML = '';
      for (let i = 0; i < expenses.length; i++) {
        const item = expenses[i];
        const row = document.createElement('tr');
        row.innerHTML = '<td>' + item.name + '</td>' +
                        '<td>₹' + item.amount.toFixed(2) + '</td>' +
                        '<td><span class="tag tag-' + item.category + '">' + item.category + '</span></td>';
        expenseTableBody.appendChild(row);
      }
    }

    incomeInput.addEventListener('input', function(e) {
      income = parseFloat(e.target.value) || 0;
      updateReport();
    });

    expenseForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = expenseNameInput.value.trim();
      const amount = parseFloat(expenseAmountInput.value);

      if (name && !isNaN(amount) && amount >= 0) {
        const category = categorizeExpense(amount);
        expenses.push({ name: name, amount: amount, category: category });

        expenseNameInput.value = '';
        expenseAmountInput.value = '';

        updateReport();
      }
    });

    // Button to pre-fill sample data
    loadDemoBtn.addEventListener('click', function() {
      income = 50000;
      incomeInput.value = 50000;
      
      expenses = [
        { name: 'House Rent', amount: 15000, category: 'High' },
        { name: 'Groceries', amount: 4500, category: 'Medium' },
        { name: 'Electricity Bill', amount: 1200, category: 'Medium' },
        { name: 'Tea & Snacks', amount: 450, category: 'Low' }
      ];

      updateReport();
    });
  </script>
</body>
</html>
